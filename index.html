<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabriel - 50h / 100h</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial;background:#0f172a;color:white;display:flex;justify-content:center;padding:20px;min-height:100vh;margin:0}
.container{width:100%;max-width:420px}
.card{background:#1e293b;padding:22px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.3);margin-bottom:12px}
.bar{background:#334155;height:22px;border-radius:11px;overflow:hidden;margin:10px 0}
.fill{background:#22c55e;height:100%;width:50%;transition:width .5s}
.calc-display{background:#0f172a;color:#22c55e;font-size:28px;text-align:right;padding:12px;border-radius:8px;margin-bottom:8px;min-height:50px}
.calc-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:2px}
button.calc{width:48px;height:48px;font-size:18px;margin:3px;background:#334155;color:white;border:none;border-radius:8px;cursor:pointer}
button.calc.op{background:#22c55e;color:#0f172a}
button.calc.clear{background:#ef4444;color:white}
input,textarea{padding:10px;border-radius:8px;border:none;width:100%;margin-top:6px}
button{padding:12px;border:none;border-radius:8px;background:#22c55e;font-weight:bold;cursor:pointer;width:100%;margin-top:6px}
</style>
</head>
<body>
<div class="container">
<div class="card"><h2>Gabriel - 50h / 100h</h2><div class="bar"><div class="fill"></div></div><p style="font-size:12px;color:#cbd5e1">Aula 11 - Conversor de Moeda - VOCE CODA! 50h em 2h reais!</p></div>
<div class="card"><h3>🧮 Calculadora - CODADA!</h3><div id="calcDisplay" class="calc-display">0</div><div class="calc-grid">
<button class="calc clear" onclick="calcClear()">C</button><button class="calc" onclick="calcAdd('/')">/</button><button class="calc" onclick="calcAdd('*')">x</button><button class="calc" onclick="calcAdd('-')">-</button>
<button class="calc" onclick="calcAdd('7')">7</button><button class="calc" onclick="calcAdd('8')">8</button><button class="calc" onclick="calcAdd('9')">9</button><button class="calc op" onclick="calcAdd('+')">+</button>
<button class="calc" onclick="calcAdd('4')">4</button><button class="calc" onclick="calcAdd('5')">5</button><button class="calc" onclick="calcAdd('6')">6</button><button class="calc op" onclick="calcResult()">=</button>
<button class="calc" onclick="calcAdd('1')">1</button><button class="calc" onclick="calcAdd('2')">2</button><button class="calc" onclick="calcAdd('3')">3</button><button class="calc" onclick="calcAdd('0')">0</button><button class="calc" style="width:100px" onclick="calcAdd('.')">.</button>
</div></div>
<div class="card" style="border:1px solid #22c55e"><h3 style="font-size:13px">💱 Aula 11: Conversor R$ -> US$ (VOCE CODA)</h3><input id="reais" type="number" value="55"><button onclick="converter()" style="background:#22c55e">Converter pra Dólar</button><div id="resultadoDolar" style="background:#0f172a;color:#22c55e;font-size:20px;text-align:center;padding:10px;border-radius:8px;margin-top:8px">U$ 10.00</div></div>
<div class="card"><input id="nome" placeholder="Seu nome"><input id="email" placeholder="Seu email"><textarea id="msg" placeholder="Sua mensagem"></textarea><button onclick="enviar()">Enviar mensagem</button></div>
</div>
<script>
function enviar(){let n=document.getElementById('nome').value.trim();let e=document.getElementById('email').value.trim();let m=document.getElementById('msg').value.trim();if(!n||!e.includes('@')||!m)return;let a="Contato - "+n;let c="Nome: "+n+"\nEmail: "+e+"\nMsg: "+m;let u="https://mail.google.com/mail/?view=cm&fs=1&to=ademirgabrieltierlingdasilva@gmail.com&su="+encodeURIComponent(a)+"&body="+encodeURIComponent(c);window.open(u,"_blank");}
let display=document.getElementById('calcDisplay');let calcValor='';
function calcAdd(caractere){calcValor+=caractere;display.innerText=calcValor;}
function calcClear(){calcValor='';display.innerText='0';}
function calcResult(){try{calcValor=eval(calcValor).toString();display.innerText=calcValor;}catch{display.innerText='Erro';}}
function converter(){let reais=document.getElementById('reais').value;let numero=Number(reais);let dolar=numero/5.5;document.getElementById('resultadoDolar').innerText='U$ '+dolar.toFixed(2);}
</script>
</body>
</html>
