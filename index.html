<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabriel - 20h / 100h</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;display:flex;justify-content:center;padding:20px;min-height:100vh;align-items:center}
.card{background:#1e293b;padding:30px;border-radius:16px;width:380px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.bar{background:#334155;height:22px;border-radius:11px;overflow:hidden;margin:15px 0}
.fill{background:#22c55e;height:100%;width:20%}
.bio{color:#cbd5e1;font-size:14px;line-height:1.5;margin-bottom:15px}
input,textarea{padding:10px;border-radius:8px;border:none;width:100%;margin-top:10px;box-sizing:border-box;font-size:14px}
textarea{resize:vertical}
button{padding:12px;border:none;border-radius:8px;background:#22c55e;font-weight:bold;cursor:pointer;margin-top:10px;width:100%;font-size:16px}
button:hover{background:#16a34a}
.error{color:#f87171;font-size:12px;display:none;margin-top:5px}
.links{margin-top:20px;display:flex;justify-content:center;gap:12px;font-size:13px}
.links a{color:#94a3b8;text-decoration:none}
.links a:hover{color:#22c55e}
.skills{margin-top:15px;display:flex;gap:6px;flex-wrap:wrap}
.tag{background:#334155;color:#cbd5e1;padding:4px 8px;border-radius:12px;font-size:11px}
</style>
</head>
<body>
<div class="card">
<h2>Gabriel - 20h / 100h</h2>
<div class="bar"><div class="fill"></div></div>
<p class="bio">Comecei pra aprender, sem pressão. Fiz 16h e curti. Agora tô indo atrás das 100h pra primeira vaga.</p>
<div class="skills">
<span class="tag">HTML</span>
<span class="tag">CSS</span>
<span class="tag">JavaScript</span>
<span class="tag">Git / GitHub</span>
</div>
<br>
<input id="nome" placeholder="Seu nome">
<p id="erroNome" class="error">Digite seu nome</p>
<input id="email" placeholder="Seu email">
<p id="erroEmail" class="error">Email precisa ter @</p>
<textarea id="msg" rows="4" placeholder="Sua mensagem"></textarea>
<p id="erroMsg" class="error">Digite uma mensagem</p>
<button onclick="enviar()">Enviar mensagem</button>
<p id="ok" style="color:#22c55e;display:none;text-align:center;margin-top:15px;font-weight:bold">Abrindo seu email... Se nao abrir, permita pop-ups!</p>
<div class="links">
<a href="https://github.com/gabriel1243324" target="_blank">GitHub</a>
<span style="color:#334155">•</span>
<a href="https://github.com/gabriel1243324/primeiro-emprego-dev" target="_blank">Código do site</a>
</div>
</div>
<script>
function enviar(){
 let nome = document.getElementById('nome').value.trim();
 let email = document.getElementById('email').value.trim();
 let msg = document.getElementById('msg').value.trim();
 document.getElementById('erroNome').style.display = nome ? 'none':'block';
 document.getElementById('erroEmail').style.display = email.includes('@') ? 'none':'block';
 document.getElementById('erroMsg').style.display = msg ? 'none':'block';
 if(!nome || !email.includes('@') || !msg){ return; }
 document.getElementById('ok').style.display = 'block';
 let assunto = "Contato do Portfolio - " + nome;
 let corpo = "Nome: " + nome + "\nEmail: " + email + "\nMensagem: " + msg;
 let gmailUrl = "https://mail.google.com/mail/?view=cm&fs=1&to=ademirgabrieltierlingdasilva@gmail.com&su=" + encodeURIComponent(assunto) + "&body=" + encodeURIComponent(corpo);
 window.open(gmailUrl, "_blank");
}
</script>
</body>
</html>
